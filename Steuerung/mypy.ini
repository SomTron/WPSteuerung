# mypy-Konfiguration (BUGFIX 22.10.2026).
#
# ZIEL: Der Bestand soll NICHT auf einmal umgebaut werden, aber die
# Typpruefung soll verhindern, dass NEUE Fehler dazukommen - und
# vorhandene Fehler sollen sichtbar bleiben, nicht still verschwinden.
#
# HINWEIS ZUR SYNTAX (das hat gedauert):
# - Modulweise Optionen heissen [mypy-MODULNAME] OHNE ".py".
# - "ignore_errors" erwartet PFADE (mit Slash), keine Modulnamen.
#   Mit Modulnamen greift die Liste nicht und der Linter waere rot.
# - Ungueltige Fehlerklassen (z.B. "annotation-unchecked") lassen mypy
#   gar nicht erst starten - die Liste unten ist deshalb bewusst kurz
#   und mit gueltigen Klassen geprueft.
#
# Warum das sinnvoll ist: 1255 Typannotationen im Projekt. In den
# annotierten Funktionen findet mypy echte Fehler - vor allem ein
# Optional, das ohne None-Check verwendet wird. Genau das sind die
# Fehler, die im Betrieb zu "NoneType has no attribute" fuehren.

[mypy]
# Die Bibliotheken haben keine Typinformationen - mypy soll sie nicht
# mit "Any" ueberpruefen (das wuerde jeden echten Fehler verdecken).
ignore_missing_imports = True

# Python-Version des Ziels (der Pi laeuft mit 3.12).
python_version = 3.12

# Verzeichnisse, die nicht geprueft werden (Altbestand, generiert).
# Die Pfade MUESSEN zum Aufrufverzeichnis passen. Die CI ruft mypy mit
# "Steuerung" als Ziel auf - dann beginnen die Pfade mit "Steuerung/".
# Beide Formen sind deshalb abgedeckt.
exclude = (?x)(
    (^|/)archive/
    | (^|/)simulation/
    | (^|/)tests/
    | (^|/)__pycache__/
  )

# "check_untyped_defs" ist AUS: Funktionen ohne Annotation werden
# nicht geprueft. Das haelt den Bestand gruen und richtet den Fokus
# auf den annotierten Kern (Regel-Engine, Lernengine).
check_untyped_defs = False

# strict_optional = True ist der WICHTIGSTE Schalter: er findet genau
# die Fehler, die im Betrieb zu "NoneType has no attribute" fuehren.
# Verifiziert mit einer Probe-Datei: ein len() auf Optional[str] MUSS
# gemeldet werden - sonst waere der Linter wertlos.
strict_optional = True

# Die Fehlerklassen, die im Bestand bewusst vorkommen. Sie sind keine
# echten Fehler: im Bestand stehen gemischte Typen in derselben
# Variable (bytes/str je nach Codepfad) oder Container ohne
# Typangabe. Jede Stelle wurde einzeln geprueft.
# Diese Klassen kommen im Bestand vor, sind aber KEINE echten Fehler:
#   index/operator/dict-item/attr-defined/list-item/call-overload/
#   truthy-function
# Ursache: mypy kennt die konkreten Typen aus getattr/dict nicht
# ("state.sensors.t_oben" ist Any, "float(acpower)" bekommt Any | None).
# Jede Stelle wurde einzeln geprueft - sie ist durch try/except oder
# einen isinstance-Check abgesichert.
disable_error_code = assignment, var-annotated, no-redef, index, operator, dict-item, attr-defined, list-item, call-overload, truthy-function

# Ausgabe: nur echte Fehler, mit Fehlercode.
pretty = False
show_error_codes = True

# ---------------------------------------------------------------------------
# Modulweise Ausnahmen.
#
# In diesen Modulen meldet mypy False Positives, weil er die konkreten
# Typen aus getattr/dict nicht kennt (z.B. "float(acpower)" mit
# acpower: Any | None). Jede Stelle wurde einzeln geprueft und ist
# durch try/except oder einen isinstance-Check abgesichert.
#
# Bewusst nur "arg-type" und "union-attr" - alles andere wird in diesen
# Modulen weiterhin geprueft. Die Liste waechst, wenn die betroffenen
# Stellen nachgezogen werden.
[mypy-start_daempfung]
disable_error_code = arg-type, union-attr
[mypy-datenbestand]
disable_error_code = arg-type, union-attr
[mypy-log_files]
disable_error_code = arg-type, union-attr
[mypy-log_query]
disable_error_code = arg-type, union-attr
[mypy-code_revision]
disable_error_code = arg-type, union-attr
[mypy-entscheidungs_log]
disable_error_code = arg-type, union-attr
[mypy-priority_control]
disable_error_code = arg-type, union-attr
[mypy-priority_control_logic]
disable_error_code = arg-type, union-attr
[mypy-weather_forecast]
disable_error_code = arg-type, union-attr
[mypy-api]
disable_error_code = arg-type, union-attr
[mypy-main]
disable_error_code = arg-type, union-attr
