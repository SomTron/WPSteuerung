[pytest]
# Konfiguration liegt im Repo-Root, nicht in Steuerung/.
#
# BUGFIX: Vorher lag sie in Steuerung/. Ein nacktes `python -m pytest` im
# Repo-Root fand die Datei nicht, sammelte damit auch Steuerung/archive/
# ein und brach ab:
#   ERROR Steuerung/archive/test_legacy_control_logic.py
#   ImportError: cannot import name 'determine_mode_and_setpoints'
#   Interrupted: 2 errors during collection
# Wer nur die Tests aus Steuerung/ aufrief, sah den Fehler nie - die CI
# ruft "pytest Steuerung/tests" auf und war deshalb gruen.
#
# testpaths ist relativ zum Rootdir (Repo-Root) angegeben.
testpaths = Steuerung/tests
python_files = test_*.py
norecursedirs = android webapp simulation archive RPI_updater .git .venv .ci_venv __pycache__ node_modules
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    contract: Vertrags-/Strukturtests. Sie pruefen Absichten im Quelltext
        (z.B. "diese Logzeile muss stehen") und sind damit beim Refactoring
        rueckwaertsbrechend, auch wenn die Logik gleichwertig umgebaut wird.
        Gezielt laufbar: pytest -m "not contract".