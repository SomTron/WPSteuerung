name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read
  issues: write        # fuer den automatischen Fehlbericht unten

jobs:
  syntaxcheck-und-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg        # matplotlib ohne Display (Headless-Runner)
      PYTHONFAULTHANDLER: 1
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          echo "--- installierte Versionen ---"
          pip freeze

      - name: Syntaxcheck aller Steuerungsmodule (compileall)
        # archive/ und simulation/ sind historisch bzw. manuell und werden
        # bewusst nicht geprueft; Tests laufen unten ohnehin via pytest.
        run: |
          python -m compileall -q Steuerung -x "(archive|simulation|tests)"
          echo "compileall OK"

      - name: Test-Sammlung pruefen (Diagnose)
        run: |
          python -m pytest Steuerung/tests -m "not integration" --collect-only -q
          echo "collect-only OK"

      - name: Unit-Tests (ohne Live-API-Integrationstests)
        # integration-Marker = echte Telegram-Nachrichten/Credentials -> in CI skippen.
        # Ausgabe wird mitgeschrieben, damit der Fehlbericht-Schritt sie verarbeiten kann.
        run: |
          set -o pipefail
          python -m pytest Steuerung/tests -m "not integration" -q --tb=long -ra 2>&1 | tee pytest_output.txt

      - name: Fehlbericht als Issue anlegen
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let out = '';
            try { out = fs.readFileSync('pytest_output.txt', 'utf8'); } catch (e) {
              out = 'pytest_output.txt konnte nicht gelesen werden: ' + e.message;
            }
            const zeilen = out.split('\n');
            const tail = zeilen.slice(-150).join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `CI fehlgeschlagen: ${context.sha.substring(0,7)} (${context.payload.ref})`,
              body: 'Automatisch erzeugt von Run ' + context.runId + '.\n\n' +
                    'Letzte 150 Zeilen der Pytest-Ausgabe:\n\n' +
                    '```\n' + tail + '\n```'
            });
