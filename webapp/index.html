<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1a1a2e">
    <title>Wärmepumpen Steuerung</title>
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0f0f1e;
            --bg-secondary: #1a1a2e;
            --bg-card: #16213e;
            --accent-primary: #00d4ff;
            --accent-secondary: #ff6b6b;
            --accent-success: #51cf66;
            --accent-warning: #ffd43b;
            --text-primary: #ffffff;
            --text-secondary: #a0a0c0;
            --shadow: rgba(0, 212, 255, 0.2);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeInDown 0.6s ease-out;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-primary), #0099ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1rem;
        }

                .status-indicator {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 15px;
            padding: 8px 16px;
            background: rgba(0, 212, 255, 0.1);
            border-radius: 20px;
            font-size: 0.9rem;
        }

        .status-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .status-badge {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .badge-compressor {
            background: rgba(81, 207, 102, 0.2);
            color: var(--accent-success);
        }

        .badge-compressor.off {
            background: rgba(255, 107, 107, 0.15);
            color: var(--accent-secondary);
        }

        .badge-night {
            background: rgba(99, 110, 250, 0.2);
            color: #748ffc;
        }

        .badge-info {
            background: rgba(0, 212, 255, 0.2);
            color: var(--accent-primary);
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--accent-success);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.6;
                transform: scale(1.1);
            }
        }

                .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .grid-wide {
            grid-column: 1 / -1;
        }

        .chart-container {
            grid-column: 1 / -1;
        }

        .card {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 48px var(--shadow);
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 20px;
        }

        .card-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            background: linear-gradient(135deg, var(--accent-primary), #0099ff);
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-primary);
            flex: 1;
        }

        .btn-small {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            background: linear-gradient(135deg, var(--accent-primary), #0099ff);
            color: white;
        }

        .btn-small:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px var(--shadow);
        }

        .temp-display {
            display: flex;
            align-items: baseline;
            gap: 8px;
            margin: 10px 0;
        }

        .temp-value {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-primary), #00b4d8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .temp-unit {
            font-size: 1.5rem;
            color: var(--text-secondary);
        }

        .temp-label {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-top: 5px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            flex: 1;
            padding: 14px 24px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn:active::before {
            width: 300px;
            height: 300px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-primary), #0099ff);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px var(--shadow);
        }

        .btn-danger {
            background: linear-gradient(135deg, var(--accent-secondary), #ff4757);
            color: white;
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(255, 107, 107, 0.3);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .toggle-switch {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            margin: 10px 0;
            transition: background 0.3s ease;
            cursor: pointer;
        }

        .toggle-switch:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .toggle-label {
            font-size: 1rem;
            color: var(--text-primary);
        }

        .switch {
            position: relative;
            width: 60px;
            height: 30px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            transition: background 0.3s ease;
        }

        .switch.active {
            background: var(--accent-primary);
        }

        .switch::after {
            content: '';
            position: absolute;
            top: 3px;
            left: 3px;
            width: 24px;
            height: 24px;
            background: white;
            border-radius: 50%;
            transition: transform 0.3s ease;
        }

        .switch.active::after {
            transform: translateX(30px);
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .info-value {
            color: var(--text-primary);
            font-weight: 600;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .badge-success {
            background: rgba(81, 207, 102, 0.2);
            color: var(--accent-success);
        }

        .badge-danger {
            background: rgba(255, 107, 107, 0.2);
            color: var(--accent-secondary);
        }

                .badge-warning {
            background: rgba(255, 212, 59, 0.2);
            color: var(--accent-warning);
        }

        .badge-purple {
            background: rgba(177, 151, 252, 0.2);
            color: #b197fc;
        }

        .badge-orange {
            background: rgba(255, 169, 77, 0.2);
            color: #ffa94d;
        }

        .rule-card {
            padding: 10px 14px;
            border-radius: 10px;
            margin: 6px 0;
            border-left: 3px solid transparent;
            font-size: 0.85rem;
            transition: all 0.3s ease;
        }

        .rule-card.winner {
            background: rgba(81, 207, 102, 0.1);
            border-left-color: var(--accent-success);
        }

        .rule-card.loser {
            background: rgba(255, 255, 255, 0.02);
            border-left-color: rgba(255, 255, 255, 0.1);
            opacity: 0.6;
        }

        .rule-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .rule-name {
            font-weight: 600;
        }

        .rule-prio {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .rule-detail {
            color: var(--text-secondary);
            font-size: 0.8rem;
        }

        .loading {
            text-align: center;
            padding: 40px;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--accent-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }

            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="container">
                <header>
            <h1>Wärmepumpen Steuerung</h1>
            <p class="subtitle">Pareto-Prioritätenregelung mit Solar-Integration</p>
            <div class="status-bar">
                <div class="status-indicator">
                    <span class="status-dot"></span>
                    <span id="connection-status">Verbunden</span>
                </div>
                <span class="status-badge badge-compressor off" id="header-compressor">Kompressor AUS</span>
                <span class="status-badge badge-night" id="header-nightsperre" style="display:none">🌙 Nacht</span>
                <span class="status-badge badge-info" id="header-rule" style="display:none"></span>
            </div>
        </header>

        <div id="app">
            <div class="loading">
                <div class="spinner"></div>
                <p style="margin-top: 20px; color: var(--text-secondary);">Lade Daten...</p>
            </div>
        </div>
    </div>

        <script>
        const API_BASE = `http://${window.location.hostname}:5000`;
        let statusData = null;
        let chart = null;
        let temperatureHistory = { timestamps: [], oben: [], mittig: [], unten: [], verdampfer: [] };
        const MAX_DATA_POINTS = 120;

        async function fetchStatus() {
            try {
                const response = await fetch(`${API_BASE}/status`);
                if (!response.ok) throw new Error('API Fehler');
                statusData = await response.json();

                // Temperaturdaten zur Historie hinzufügen
                addToHistory(statusData.temperatures);

                // Nur beim ersten Mal oder wenn die Struktur sich ändert
                                if (!document.getElementById('compressor-card')) {
                    renderApp();
                } else {
                    updateValues();
                }

                updateHeader();
                updateConnectionStatus(true);
            } catch (error) {
                console.error('Fehler beim Abrufen der Daten:', error);
                updateConnectionStatus(false);
            }
        }

        async function loadHistory() {
            try {
                const hours = 24;
                const response = await fetch(`${API_BASE}/history?hours=${hours}`);
                if (!response.ok) throw new Error('History API Fehler');
                const historyData = await response.json();

                // Clear current history
                temperatureHistory = {
                    timestamps: [],
                    oben: [],
                    mittig: [],
                    unten: [],
                    verdampfer: []
                };

                // Load historical data
                historyData.data.forEach(point => {
                    const timestamp = new Date(point.timestamp);
                    const timeStr = timestamp.toLocaleTimeString('de-DE', {
                        hour: '2-digit',
                        minute: '2-digit'
                    });

                    temperatureHistory.timestamps.push(timeStr);
                    temperatureHistory.oben.push(point.t_oben);
                    temperatureHistory.mittig.push(point.t_mittig);
                    temperatureHistory.unten.push(point.t_unten);
                    temperatureHistory.verdampfer.push(point.t_verd);
                });

                                if (chart) {
                    updateChart();
                }
            } catch (error) {
                console.error('Fehler beim Laden der Historie:', error);
            }
        }

        function addToHistory(temps) {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('de-DE', {
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });

            temperatureHistory.timestamps.push(timeStr);
            temperatureHistory.oben.push(temps.oben);
            temperatureHistory.mittig.push(temps.mittig);
            temperatureHistory.unten.push(temps.unten);
            temperatureHistory.verdampfer.push(temps.verdampfer);

            // Nur die letzten MAX_DATA_POINTS behalten
            if (temperatureHistory.timestamps.length > MAX_DATA_POINTS) {
                temperatureHistory.timestamps.shift();
                temperatureHistory.oben.shift();
                temperatureHistory.mittig.shift();
                temperatureHistory.unten.shift();
                temperatureHistory.verdampfer.shift();
            }

            if (chart) {
                updateChart();
            }
        }

                function createChart() {
            const ctx = document.getElementById('tempChart');
            if (!ctx) return;
            if (chart) chart.destroy();
            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: temperatureHistory.timestamps,
                    datasets: [
                        { label: 'Oben', data: temperatureHistory.oben, borderColor: '#00d4ff', borderWidth: 2, pointRadius: 0, tension: 0.3 },
                        { label: 'Mitte', data: temperatureHistory.mittig, borderColor: '#51cf66', borderWidth: 2, pointRadius: 0, tension: 0.3 },
                        { label: 'Unten', data: temperatureHistory.unten, borderColor: '#ffa94d', borderWidth: 2, pointRadius: 0, tension: 0.3 },
                        { label: 'Verdampfer', data: temperatureHistory.verdampfer, borderColor: '#ff6b6b', borderWidth: 2, pointRadius: 0, tension: 0.3, yAxisID: 'y1' }
                    ]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: {
                        legend: { display: true, position: 'top', labels: { color: '#a0a0c0', font: { size: 11 }, usePointStyle: true } },
                        tooltip: { mode: 'index', intersect: false, backgroundColor: 'rgba(22, 33, 62, 0.95)', titleColor: '#fff', bodyColor: '#a0a0c0', borderColor: 'rgba(0, 212, 255, 0.3)', borderWidth: 1 }
                    },
                    scales: {
                        y: { beginAtZero: false, grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#a0a0c0', callback: v => v + ' °C' }, title: { display: true, text: 'Boiler (°C)', color: '#a0a0c0' } },
                        y1: { position: 'right', beginAtZero: false, grid: { display: false }, ticks: { color: '#ff6b6b', callback: v => v + ' °C' }, title: { display: true, text: 'Verdampfer (°C)', color: '#ff6b6b' } },
                        x: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#a0a0c0', maxRotation: 45, minRotation: 45, maxTicksLimit: 20 } }
                    },
                    interaction: { mode: 'nearest', axis: 'x', intersect: false }
                }
            });
        }

        function updateChart() {
            if (!chart) return;
            chart.data.labels = temperatureHistory.timestamps;
            chart.data.datasets[0].data = temperatureHistory.oben;
            chart.data.datasets[1].data = temperatureHistory.mittig;
            chart.data.datasets[2].data = temperatureHistory.unten;
            chart.data.datasets[3].data = temperatureHistory.verdampfer;
            chart.update('none');
        }

                function updateHeader() {
            if (!statusData) return;
            const { compressor, mode } = statusData;
            const isRunning = compressor.status === 'EIN';
            const hComp = document.getElementById('header-compressor');
            hComp.textContent = isRunning ? 'Kompressor EIN' : 'Kompressor AUS';
            hComp.className = 'status-badge badge-compressor' + (isRunning ? '' : ' off');
            const hNight = document.getElementById('header-nightsperre');
            hNight.style.display = mode.nightsperre_active ? '' : 'none';
            const hRule = document.getElementById('header-rule');
            if (mode.active_rule) { hRule.textContent = mode.active_rule; hRule.style.display = ''; } else { hRule.style.display = 'none'; }
        }

        function updateConnectionStatus(connected) {
            const statusEl = document.getElementById('connection-status');
            const dotEl = document.querySelector('.status-dot');
            if (connected) {
                statusEl.textContent = 'Verbunden';
                dotEl.style.background = 'var(--accent-success)';
            } else {
                statusEl.textContent = 'Verbindung unterbrochen';
                dotEl.style.background = 'var(--accent-secondary)';
            }
        }

        async function sendControl(command, params = {}) {
            try {
                const response = await fetch(`${API_BASE}/control`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ command, params })
                });
                const result = await response.json();
                console.log('Control result:', result);
                await fetchStatus();
            } catch (error) {
                console.error('Fehler beim Senden des Befehls:', error);
            }
        }

                function updateValues() {
            if (!statusData) return;

            const { temperatures, compressor, mode, energy, system, setpoints, priority } = statusData;
            const isRunning = compressor.status === 'EIN';

            // Kompressor
            const cs = document.getElementById('compressor-status');
            cs.className = 'badge ' + (isRunning ? 'badge-success' : 'badge-danger');
            cs.textContent = isRunning ? 'AKTIV' : 'AUS';
            document.getElementById('runtime-today').textContent = compressor.runtime_today;
            const rcr = document.getElementById('runtime-current-row');
            if (isRunning) {
                if (!rcr) {
                    const row = document.createElement('div');
                    row.className = 'info-row'; row.id = 'runtime-current-row';
                    row.innerHTML = '<span class="info-label">Aktuelle Laufzeit</span><span class="info-value" id="runtime-current">' + compressor.runtime_current + '</span>';
                    document.getElementById('runtime-today-row').after(row);
                } else {
                    document.getElementById('runtime-current').textContent = compressor.runtime_current;
                }
            } else if (rcr) { rcr.remove(); }
            const btn = document.getElementById('compressor-btn');
            btn.className = 'btn ' + (isRunning ? 'btn-danger' : 'btn-primary');
            btn.textContent = isRunning ? 'Ausschalten' : 'Einschalten';
            btn.onclick = function() { sendControl(isRunning ? 'force_off' : 'force_on'); };

            // Temperaturen
            document.getElementById('temp-boiler').textContent = temperatures.boiler?.toFixed(1) || 'N/A';
            document.getElementById('temp-oben').textContent = temperatures.oben?.toFixed(1) || 'N/A';
            document.getElementById('temp-mittig').textContent = temperatures.mittig?.toFixed(1) || 'N/A';
            document.getElementById('temp-unten').textContent = temperatures.unten?.toFixed(1) || 'N/A';
            document.getElementById('temp-verdampfer').textContent = temperatures.verdampfer?.toFixed(1) || 'N/A';

            // Sollwerte
            document.getElementById('setpoint-ein').textContent = setpoints?.einschaltpunkt ?? 'N/A';
            document.getElementById('setpoint-aus').textContent = setpoints?.ausschaltpunkt ?? 'N/A';
            document.getElementById('setpoint-sicherheit').textContent = setpoints?.sicherheits_temp ?? 'N/A';
            document.getElementById('setpoint-verdampfer').textContent = setpoints?.verdampfertemperatur ?? 'N/A';

            // Aktive Regel
            const ruleName = mode.active_rule || 'Keine';
            document.getElementById('rule-name').textContent = ruleName;
            document.getElementById('rule-sensor').textContent = mode.active_rule_sensor ? 'Fuehler: ' + mode.active_rule_sensor : '';
            const rd = document.getElementById('rule-decision');
            if (mode.blocking_reason) { rd.textContent = mode.blocking_reason; rd.className = 'badge badge-warning'; }
            else if (mode.soll_einschalten) { rd.textContent = 'EINSCHALTEN empfohlen'; rd.className = 'badge badge-success'; }
            else { rd.textContent = 'AUS - kein Bedarf'; rd.className = 'badge badge-danger'; }

            // Prioritaeten-Regeln aktualisieren
            if (priority && priority.regeln) {
                const container = document.getElementById('rules-list');
                if (container) {
                    container.innerHTML = priority.regeln.map(function(r) {
                        const isWinner = ruleName === r.name;
                        let detail = '';
                        if (r.typ === 'pv') detail = 'PV >= ' + r.schwellwert + 'W | ' + r.ein + '-' + r.aus + ' C';
                        else if (r.typ === 'komfort') detail = 'Notfall ' + r.notfall + 'C | MinPV ' + r.min_pvid + 'W';
                        else if (r.typ === 'zeitfenster') detail = r.start + '-' + r.ende + ' | PV >= ' + r.min_pv + 'W';
                        else if (r.typ === 'abweichung') detail = 'Soll ' + r.soll + 'C | +' + r.ein + 'K / -' + r.aus + 'K';
                        return '<div class="rule-card ' + (isWinner ? 'winner' : 'loser') + '">' +
                            '<div class="rule-header"><span class="rule-name">' + (isWinner ? '> ' : '') + r.name + '</span><span class="rule-prio">P' + r.prio + '</span></div>' +
                            '<div class="rule-detail">' + detail + '</div></div>';
                    }).join('');
                }
            }

            // Modi
            document.getElementById('mode-current').textContent = mode.current || 'Normal';
            document.getElementById('switch-bath').className = 'switch' + (mode.bath_active ? ' active' : '');
            document.getElementById('switch-holiday').className = 'switch' + (mode.holiday_active ? ' active' : '');
            document.getElementById('switch-solar').className = 'switch' + (mode.solar_active ? ' active' : '');
            document.getElementById('switch-night').className = 'switch' + (mode.nightsperre_active ? ' active' : '');

            // Energie
            document.getElementById('energy-soc').textContent = energy.soc ?? 0;
            document.getElementById('energy-battery').textContent = energy.battery_power ?? 0;
            document.getElementById('energy-feedin').textContent = energy.feed_in ?? 0;
            document.getElementById('energy-ac').textContent = energy.ac_power ?? 'N/A';
            document.getElementById('energy-forecast-today').textContent = energy.forecast_today != null ? Math.round(energy.forecast_today) + ' Wh' : 'N/A';
            document.getElementById('energy-forecast-tomorrow').textContent = energy.forecast_tomorrow != null ? Math.round(energy.forecast_tomorrow) + ' Wh' : 'N/A';

            // System
            document.getElementById('system-update').textContent = system.last_update;
            document.getElementById('system-sunrise').textContent = energy.sunrise || 'N/A';
            document.getElementById('system-sunset').textContent = energy.sunset || 'N/A';
            if (priority) {
                document.getElementById('system-wp-leistung').textContent = (priority.wp_leistung || 0) + ' W';
                document.getElementById('system-nachtsperre').textContent = priority.nachtsperre_aktiv ? (priority.nachtsperre_start || '') + ' - ' + (priority.nachtsperre_ende || '') : 'Inaktiv';
            }
            const errEl = document.getElementById('exclusion-reason-row');
            if (system.exclusion_reason) {
                if (!errEl) {
                    const row = document.createElement('div');
                    row.className = 'info-row'; row.id = 'exclusion-reason-row';
                    row.innerHTML = '<span class="info-label">Fehler</span><span class="info-value badge badge-warning" id="exclusion-reason">' + system.exclusion_reason + '</span>';
                    document.getElementById('system-update-row').after(row);
                } else {
                    document.getElementById('exclusion-reason').textContent = system.exclusion_reason;
                }
            } else if (errEl) { errEl.remove(); }
        }

                function renderApp() {
            if (!statusData) return;
            const { temperatures, compressor, mode, energy, system, setpoints, priority } = statusData;
            const isRunning = compressor.status === 'EIN';

            const regelnHtml = (priority && priority.regeln) ? priority.regeln.map(r => {
                const isWinner = mode.active_rule === r.name;
                let detail = '';
                if (r.typ === 'pv') detail = 'PV >= ' + r.schwellwert + 'W | ' + r.ein + '-' + r.aus + ' C';
                else if (r.typ === 'komfort') detail = 'Notfall ' + r.notfall + 'C | MinPV ' + r.min_pvid + 'W';
                else if (r.typ === 'zeitfenster') detail = r.start + '-' + r.ende + ' | PV >= ' + r.min_pv + 'W';
                else if (r.typ === 'abweichung') detail = 'Soll ' + r.soll + 'C | +' + r.ein + 'K / -' + r.aus + 'K';
                return '<div class="rule-card ' + (isWinner ? 'winner' : 'loser') + '">' +
                    '<div class="rule-header"><span class="rule-name">' + (isWinner ? '> ' : '') + r.name + '</span><span class="rule-prio">P' + r.prio + '</span></div>' +
                    '<div class="rule-detail">' + detail + '</div></div>';
            }).join('') : '<div class="rule-detail">Keine Konfiguration geladen</div>';

            const nachtsperreTxt = priority ? (priority.nachtsperre_start || '') + ' - ' + (priority.nachtsperre_ende || '') : 'N/A';

            document.getElementById('app').innerHTML = `
                <div class="grid grid-wide">
                    <div class="card">
                        <div class="card-header">
                            <div class="card-icon blue">📈</div>
                            <div class="card-title">Temperaturverlauf</div>
                            <button class="btn-small" onclick="loadHistory()">24h Laden</button>
                        </div>
                        <div style="height: 300px;"><canvas id="tempChart"></canvas></div>
                    </div>
                </div>

                <div class="grid">
                    <!-- Kompressor -->
                    <div class="card" id="compressor-card">
                        <div class="card-header">
                            <div class="card-icon ${isRunning ? 'green' : 'red'}">⚡</div>
                            <div class="card-title">Kompressor</div>
                        </div>
                        <div class="temp-display">
                            <span class="badge ${isRunning ? 'badge-success' : 'badge-danger'}" id="compressor-status">${isRunning ? 'AKTIV' : 'AUS'}</span>
                        </div>
                        <div class="info-row" id="runtime-today-row">
                            <span class="info-label">Laufzeit heute</span>
                            <span class="info-value" id="runtime-today">${compressor.runtime_today}</span>
                        </div>
                        ${isRunning ? '<div class="info-row" id="runtime-current-row"><span class="info-label">Aktuelle Laufzeit</span><span class="info-value" id="runtime-current">' + compressor.runtime_current + '</span></div>' : ''}
                        <div class="button-group">
                            <button class="btn ${isRunning ? 'btn-danger' : 'btn-primary'}" id="compressor-btn">${isRunning ? 'Ausschalten' : 'Einschalten'}</button>
                        </div>
                    </div>

                    <!-- Temperaturen -->
                    <div class="card">
                        <div class="card-header">
                            <div class="card-icon orange">🌡️</div>
                            <div class="card-title">Temperaturen</div>
                        </div>
                        <div class="temp-display">
                            <span class="temp-value" id="temp-boiler">${temperatures.boiler?.toFixed(1) || 'N/A'}</span>
                            <span class="temp-unit">°C</span>
                        </div>
                        <div class="temp-label">Boiler (Durchschnitt)</div>
                        <div class="info-row"><span class="info-label">Oben</span><span class="info-value"><span id="temp-oben">${temperatures.oben?.toFixed(1) || 'N/A'}</span> °C</span></div>
                        <div class="info-row"><span class="info-label">Mitte</span><span class="info-value"><span id="temp-mittig">${temperatures.mittig?.toFixed(1) || 'N/A'}</span> °C</span></div>
                        <div class="info-row"><span class="info-label">Unten</span><span class="info-value"><span id="temp-unten">${temperatures.unten?.toFixed(1) || 'N/A'}</span> °C</span></div>
                        <div class="info-row"><span class="info-label">Verdampfer</span><span class="info-value"><span id="temp-verdampfer">${temperatures.verdampfer?.toFixed(1) || 'N/A'}</span> °C</span></div>
                    </div>

                    <!-- Aktive Regel (Pareto) -->
                    <div class="card">
                        <div class="card-header">
                            <div class="card-icon purple">🎯</div>
                            <div class="card-title">Aktive Regel</div>
                        </div>
                        <div class="temp-display">
                            <span class="temp-value" style="font-size:1.5rem" id="rule-name">${mode.active_rule || 'Keine'}</span>
                        </div>
                        <div class="info-row"><span class="info-label">Fuehler</span><span class="info-value" id="rule-sensor">${mode.active_rule_sensor || ''}</span></div>
                        <div class="info-row"><span class="info-label">Entscheidung</span><span class="info-value" id="rule-decision"></span></div>
                        <div class="info-row"><span class="info-label">Einschaltpunkt</span><span class="info-value"><span id="setpoint-ein">${setpoints?.einschaltpunkt ?? 'N/A'}</span> °C</span></div>
                        <div class="info-row"><span class="info-label">Ausschaltpunkt</span><span class="info-value"><span id="setpoint-aus">${setpoints?.ausschaltpunkt ?? 'N/A'}</span> °C</span></div>
                        <div class="info-row"><span class="info-label">Sicherheit</span><span class="info-value"><span id="setpoint-sicherheit">${setpoints?.sicherheits_temp ?? 'N/A'}</span> °C</span></div>
                        <div class="info-row"><span class="info-label">Min. Verdampfer</span><span class="info-value"><span id="setpoint-verdampfer">${setpoints?.verdampfertemperatur ?? 'N/A'}</span> °C</span></div>
                    </div>

                    <!-- Prioritaets-Regeln -->
                    <div class="card">
                        <div class="card-header">
                            <div class="card-icon yellow">🏆</div>
                            <div class="card-title">Prioritaeten</div>
                        </div>
                        <div id="rules-list">${regelnHtml}</div>
                    </div>

                    <!-- Betriebsmodi -->
                    <div class="card">
                        <div class="card-header">
                            <div class="card-icon blue">🎛️</div>
                            <div class="card-title">Betriebsmodi</div>
                        </div>
                        <div class="info-row"><span class="info-label">Modus</span><span class="info-value" id="mode-current">${mode.current || 'Normal'}</span></div>
                        <div class="toggle-switch" onclick="toggleMode('bademodus', ${mode.bath_active})">
                            <span class="toggle-label">Bademodus</span>
                            <div class="switch ${mode.bath_active ? 'active' : ''}" id="switch-bath"></div>
                        </div>
                        <div class="toggle-switch" onclick="toggleMode('urlaubsmodus', ${mode.holiday_active})">
                            <span class="toggle-label">Urlaubsmodus</span>
                            <div class="switch ${mode.holiday_active ? 'active' : ''}" id="switch-holiday"></div>
                        </div>
                        <div class="toggle-switch">
                            <span class="toggle-label">Solar Ueberschuss</span>
                            <div class="switch ${mode.solar_active ? 'active' : ''}" id="switch-solar"></div>
                        </div>
                        <div class="toggle-switch">
                            <span class="toggle-label">Nachtsperre</span>
                            <div class="switch ${mode.nightsperre_active ? 'active' : ''}" id="switch-night"></div>
                        </div>
                    </div>

                    <!-- Energie & Solar -->
                    <div class="card">
                        <div class="card-header">
                            <div class="card-icon green">🔋</div>
                            <div class="card-title">Energie & Solar</div>
                        </div>
                        <div class="temp-display">
                            <span class="temp-value" id="energy-soc">${energy.soc ?? 0}</span>
                            <span class="temp-unit">%</span>
                        </div>
                        <div class="temp-label">Batterie</div>
                        <div class="info-row"><span class="info-label">Batterie-Leistung</span><span class="info-value"><span id="energy-battery">${energy.battery_power ?? 0}</span> W</span></div>
                        <div class="info-row"><span class="info-label">Einspeisung</span><span class="info-value"><span id="energy-feedin">${energy.feed_in ?? 0}</span> W</span></div>
                        <div class="info-row"><span class="info-label">AC-Leistung</span><span class="info-value"><span id="energy-ac">${energy.ac_power ?? 'N/A'}</span> W</span></div>
                        <div class="info-row"><span class="info-label">Prognose Heute</span><span class="info-value" id="energy-forecast-today">${energy.forecast_today != null ? Math.round(energy.forecast_today) + ' Wh' : 'N/A'}</span></div>
                        <div class="info-row"><span class="info-label">Prognose Morgen</span><span class="info-value" id="energy-forecast-tomorrow">${energy.forecast_tomorrow != null ? Math.round(energy.forecast_tomorrow) + ' Wh' : 'N/A'}</span></div>
                    </div>

                    <!-- System Info -->
                    <div class="card">
                        <div class="card-header">
                            <div class="card-icon blue">ℹ️</div>
                            <div class="card-title">System</div>
                        </div>
                        <div class="info-row" id="system-update-row"><span class="info-label">Letztes Update</span><span class="info-value" id="system-update">${system.last_update}</span></div>
                        <div class="info-row"><span class="info-label">Sonnenaufgang</span><span class="info-value" id="system-sunrise">${energy.sunrise || 'N/A'}</span></div>
                        <div class="info-row"><span class="info-label">Sonnenuntergang</span><span class="info-value" id="system-sunset">${energy.sunset || 'N/A'}</span></div>
                        <div class="info-row"><span class="info-label">WP Leistung</span><span class="info-value" id="system-wp-leistung">${priority?.wp_leistung || 0} W</span></div>
                        <div class="info-row"><span class="info-label">Nachtsperre</span><span class="info-value" id="system-nachtsperre">${nachtsperreTxt}</span></div>
                    </div>
                </div>
            `;
            setTimeout(createChart, 100);
        }

        function toggleMode(modeName, currentState) {
            sendControl('set_mode', { mode: modeName, active: !currentState });
        }

        // Auto-refresh every 5 seconds
        setInterval(fetchStatus, 5000);

        // Initial load
        fetchStatus();

        // Register service worker for PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js')
                .then(reg => console.log('Service Worker registered'))
                .catch(err => console.error('Service Worker registration failed:', err));
        }
    </script>
</body>

</html>
