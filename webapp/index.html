<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1a1a2e">
    <title>Wärmepumpen Steuerung</title>
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0f0f1e;
            --bg-secondary: #1a1a2e;
            --bg-card: #16213e;
            --accent-primary: #00d4ff;
            --accent-secondary: #ff6b6b;
            --accent-success: #51cf66;
            --accent-warning: #ffd43b;
            --text-primary: #ffffff;
            --text-secondary: #a0a0c0;
            --shadow: rgba(0, 212, 255, 0.2);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeInDown 0.6s ease-out;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-primary), #0099ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1rem;
        }

                .status-indicator {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 15px;
            padding: 8px 16px;
            background: rgba(0, 212, 255, 0.1);
            border-radius: 20px;
            font-size: 0.9rem;
        }

        .status-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .status-badge {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .badge-compressor {
            background: rgba(81, 207, 102, 0.2);
            color: var(--accent-success);
        }

        .badge-compressor.off {
            background: rgba(255, 107, 107, 0.15);
            color: var(--accent-secondary);
        }

        .badge-night {
            background: rgba(99, 110, 250, 0.2);
            color: #748ffc;
        }

        .badge-info {
            background: rgba(0, 212, 255, 0.2);
            color: var(--accent-primary);
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--accent-success);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.6;
                transform: scale(1.1);
            }
        }

                .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .grid-wide {
            grid-column: 1 / -1;
        }

        .chart-container {
            grid-column: 1 / -1;
        }

        .card {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 48px var(--shadow);
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 20px;
        }

        .card-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            background: linear-gradient(135deg, var(--accent-primary), #0099ff);
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-primary);
            flex: 1;
        }

                .btn-small {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            background: linear-gradient(135deg, var(--accent-primary), #0099ff);
            color: white;
        }

        .btn-small:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px var(--shadow);
        }

        .time-range-group {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }

        .time-btn {
            padding: 6px 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.03);
            color: var(--text-secondary);
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .time-btn:hover {
            background: rgba(0, 212, 255, 0.1);
            border-color: rgba(0, 212, 255, 0.3);
            color: var(--text-primary);
        }

        .time-btn.active {
            background: rgba(0, 212, 255, 0.2);
            border-color: var(--accent-primary);
            color: var(--accent-primary);
        }

        .chart-header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .temp-display {
            display: flex;
            align-items: baseline;
            gap: 8px;
            margin: 10px 0;
        }

        .temp-value {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-primary), #00b4d8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .temp-unit {
            font-size: 1.5rem;
            color: var(--text-secondary);
        }

        .temp-label {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-top: 5px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            flex: 1;
            padding: 14px 24px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn:active::before {
            width: 300px;
            height: 300px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-primary), #0099ff);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px var(--shadow);
        }

        .btn-danger {
            background: linear-gradient(135deg, var(--accent-secondary), #ff4757);
            color: white;
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(255, 107, 107, 0.3);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .toggle-switch {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            margin: 10px 0;
            transition: background 0.3s ease;
            cursor: pointer;
        }

        .toggle-switch:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .toggle-label {
            font-size: 1rem;
            color: var(--text-primary);
        }

        .switch {
            position: relative;
            width: 60px;
            height: 30px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            transition: background 0.3s ease;
        }

        .switch.active {
            background: var(--accent-primary);
        }

        .switch::after {
            content: '';
            position: absolute;
            top: 3px;
            left: 3px;
            width: 24px;
            height: 24px;
            background: white;
            border-radius: 50%;
            transition: transform 0.3s ease;
        }

        .switch.active::after {
            transform: translateX(30px);
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .info-value {
            color: var(--text-primary);
            font-weight: 600;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .badge-success {
            background: rgba(81, 207, 102, 0.2);
            color: var(--accent-success);
        }

        .badge-danger {
            background: rgba(255, 107, 107, 0.2);
            color: var(--accent-secondary);
        }

                .badge-warning {
            background: rgba(255, 212, 59, 0.2);
            color: var(--accent-warning);
        }

        .badge-purple {
            background: rgba(177, 151, 252, 0.2);
            color: #b197fc;
        }

        .badge-orange {
            background: rgba(255, 169, 77, 0.2);
            color: #ffa94d;
        }

                .rule-card {
            padding: 10px 14px;
            border-radius: 10px;
            margin: 6px 0;
            border-left: 3px solid transparent;
            font-size: 0.85rem;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .rule-card:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .rule-card.winner {
            background: rgba(81, 207, 102, 0.1);
            border-left-color: var(--accent-success);
        }

        .rule-card.loser {
            background: rgba(255, 255, 255, 0.02);
            border-left-color: rgba(255, 255, 255, 0.1);
            opacity: 0.6;
        }

        .rule-card.inactive {
            background: rgba(255, 255, 255, 0.01);
            border-left-color: rgba(255, 107, 107, 0.3);
            opacity: 0.4;
        }

        .rule-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .rule-name {
            font-weight: 600;
        }

        .rule-prio {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .rule-detail {
            color: var(--text-secondary);
            font-size: 0.8rem;
        }

        .rule-decision {
            display: none;
            margin-top: 8px;
            padding: 8px 10px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 6px;
            font-size: 0.8rem;
            color: var(--text-secondary);
            line-height: 1.4;
        }

        .rule-decision.visible {
            display: block;
        }

        .rule-decision .decision-ein {
            color: var(--accent-success);
            font-weight: 600;
        }

        .rule-decision .decision-aus {
            color: var(--accent-secondary);
            font-weight: 600;
        }

        .rule-decision .decision-keine {
            color: var(--text-secondary);
            font-weight: 600;
        }

        .loading {
            text-align: center;
            padding: 40px;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--accent-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }

            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="container">
                <header>
            <h1>Wärmepumpen Steuerung</h1>
            <p class="subtitle">Pareto-Prioritätenregelung mit Solar-Integration</p>
            <div class="status-bar">
                <div class="status-indicator">
                    <span class="status-dot"></span>
                    <span id="connection-status">Verbunden</span>
                </div>
                <span class="status-badge badge-compressor off" id="header-compressor">Kompressor AUS</span>
                <span class="status-badge badge-night" id="header-nightsperre" style="display:none">🌙 Nacht</span>
                <span class="status-badge badge-info" id="header-rule" style="display:none"></span>
            </div>
        </header>

        <div id="app">
            <div class="loading">
                <div class="spinner"></div>
                <p style="margin-top: 20px; color: var(--text-secondary);">Lade Daten...</p>
            </div>
        </div>
    </div>

        <script>
                const API_BASE = window.location.origin;
        let statusData = null;
        let chart = null;
        let temperatureHistory = { timestamps: [], oben: [], mittig: [], unten: [], verdampfer: [], sollwerte: [] };
        const MAX_DATA_POINTS = 120;
        let currentHistoryHours = 24;
        let isLoadingHistory = false;

        async function fetchStatus() {
            try {
                const response = await fetch(`${API_BASE}/status`);
                if (!response.ok) throw new Error('API Fehler');
                statusData = await response.json();

                // Live-Daten nur hinzufuegen wenn wir im Live-Modus sind (< 2h)
                if (currentHistoryHours <= 2 && !isLoadingHistory) {
                    addToHistory(statusData.temperatures);
                }

                                // Nur beim ersten Mal oder wenn die Struktur sich aendert
                if (!document.getElementById('compressor-card')) {
                    renderApp();
                } else {
                    updateValues();
                    updateSollwertLabel();
                    highlightActiveSensor();
                }

                updateHeader();
                updateConnectionStatus(true);
            } catch (error) {
                console.error('Fehler beim Abrufen der Daten:', error);
                updateConnectionStatus(false);
            }
        }

                async function loadHistory(hours) {
            if (isLoadingHistory) return;
            isLoadingHistory = true;
            currentHistoryHours = hours;

            // Buttons aktualisieren
            document.querySelectorAll('.time-btn').forEach(btn => {
                btn.classList.toggle('active', parseInt(btn.dataset.hours) === hours);
            });

            // Vorhandenen Chart zerstoeren (wichtig: Daten-Reset kommt danach)
            if (chart) {
                chart.destroy();
                chart = null;
            }

            try {
                const response = await fetch(`${API_BASE}/history?hours=${hours}`);
                if (!response.ok) throw new Error('History API Fehler');
                const historyData = await response.json();

                // Historische Daten laden
                temperatureHistory = {
                    timestamps: [],
                    oben: [],
                    mittig: [],
                    unten: [],
                    verdampfer: [],
                    sollwerte: []
                };

                historyData.data.forEach(point => {
                    const timestamp = new Date(point.timestamp);
                    const timeStr = hours <= 24
                        ? timestamp.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' })
                        : timestamp.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' }) + ' ' +
                          timestamp.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });

                    temperatureHistory.timestamps.push(timeStr);
                    temperatureHistory.oben.push(point.t_oben);
                    temperatureHistory.mittig.push(point.t_mittig);
                    temperatureHistory.unten.push(point.t_unten);
                    temperatureHistory.verdampfer.push(point.t_verd);
                    // Sollwerte direkt aus CSV (Einschaltpunkt-Spalte)
                    temperatureHistory.sollwerte.push(point.einschaltpunkt);
                });

                // Chart mit den geladenen Daten neu erstellen
                createChart();
                updateSollwertLabel();
                highlightActiveSensor();
            } catch (error) {
                console.error('Fehler beim Laden der Historie:', error);
                // Fallback: leeren Chart erstellen falls API fehlschlaegt
                if (!chart) createChart();
            } finally {
                isLoadingHistory = false;
            }
        }

                function updateSollwertLabel() {
            if (!statusData || !chart) return;
            const mode = statusData.mode;
            const sensorName = mode.active_rule_sensor || '?';
            chart.data.datasets[4].label = 'Einschaltpunkt (' + sensorName + ')';
            chart.update('none');
        }

        function highlightActiveSensor() {
            if (!statusData || !chart) return;
            const activeSensor = (statusData.mode.active_rule_sensor || '').toLowerCase();
            const sensorMap = { 'oben': 0, 'mittig': 1, 'mitte': 1, 'unten': 2 };
            const sensorColors = { 'oben': '#00d4ff', 'mittig': '#51cf66', 'mitte': '#51cf66', 'unten': '#ffa94d' };
            const sensorColorsBright = { 'oben': '#33e0ff', 'mittig': '#7adf85', 'mitte': '#7adf85', 'unten': '#ffb870' };

            // Alle Boiler-Sensoren zuruecksetzen (gedimmt)
            for (let i = 0; i <= 2; i++) {
                chart.data.datasets[i].borderWidth = 1.5;
                chart.data.datasets[i].pointRadius = 0;
                chart.data.datasets[i].borderColor = Object.values(sensorColors)[i];
                chart.data.datasets[i].order = 2;
            }

            // Aktiven Sensor hervorheben (dick, leuchtend, in front)
            const idx = sensorMap[activeSensor];
            if (idx !== undefined) {
                chart.data.datasets[idx].borderWidth = 3;
                chart.data.datasets[idx].borderColor = sensorColorsBright[activeSensor];
                chart.data.datasets[idx].order = 1;
            } else {
                for (let i = 0; i <= 2; i++) {
                    chart.data.datasets[i].borderWidth = 2;
                }
            }

            chart.update('none');
        }

                function updateChartSollwert() {
                    // Sollwerte kommen jetzt direkt aus der CSV - nichts zu tun
                    // Label wird in updateSollwertLabel() gesetzt
                }

                function addToHistory(temps) {
            if (currentHistoryHours > 2) return;  // Nur im Live-Modus

            const now = new Date();
            const timeStr = now.toLocaleTimeString('de-DE', {
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });

            const sollwert = statusData?.setpoints?.einschaltpunkt ?? null;

            temperatureHistory.timestamps.push(timeStr);
            temperatureHistory.oben.push(temps.oben);
            temperatureHistory.mittig.push(temps.mittig);
            temperatureHistory.unten.push(temps.unten);
            temperatureHistory.verdampfer.push(temps.verdampfer);
            temperatureHistory.sollwerte.push(sollwert);

            // Nur die letzten MAX_DATA_POINTS behalten
            if (temperatureHistory.timestamps.length > MAX_DATA_POINTS) {
                temperatureHistory.timestamps.shift();
                temperatureHistory.oben.shift();
                temperatureHistory.mittig.shift();
                temperatureHistory.unten.shift();
                temperatureHistory.verdampfer.shift();
                temperatureHistory.sollwerte.shift();
            }

            if (chart) {
                updateChart();
            }
        }

                function getBoilerRange() {
                    let min = Infinity, max = -Infinity;
                    const series = [temperatureHistory.oben, temperatureHistory.mittig, temperatureHistory.unten, temperatureHistory.sollwerte];
                    series.forEach(arr => {
                        arr.forEach(v => {
                            if (v !== null && v !== undefined && !isNaN(v)) { min = Math.min(min, v); max = Math.max(max, v); }
                        });
                    });
                    if (min === Infinity) { min = 0; max = 60; }
                    const pad = Math.max((max - min) * 0.15, 3);
                    return { min: Math.floor(min - pad), max: Math.ceil(max + pad) };
                }
                function getVerdampferRange() {
                    let min = Infinity, max = -Infinity;
                    temperatureHistory.verdampfer.forEach(v => {
                        if (v !== null && v !== undefined && !isNaN(v)) { min = Math.min(min, v); max = Math.max(max, v); }
                    });
                    if (min === Infinity) { min = -10; max = 15; }
                    const pad = Math.max((max - min) * 0.15, 3);
                    return { min: Math.floor(min - pad), max: Math.ceil(max + pad) };
                }
                function createChart() {
                    const ctx = document.getElementById('tempChart');
                    if (!ctx) return;
                    if (chart) chart.destroy();
                    chart = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: temperatureHistory.timestamps,
                            datasets: [
                                { label: 'Oben', data: temperatureHistory.oben, borderColor: '#00d4ff', borderWidth: 2, pointRadius: 0, tension: 0.3 },
                                { label: 'Mitte', data: temperatureHistory.mittig, borderColor: '#51cf66', borderWidth: 2, pointRadius: 0, tension: 0.3 },
                                { label: 'Unten', data: temperatureHistory.unten, borderColor: '#ffa94d', borderWidth: 2, pointRadius: 0, tension: 0.3 },
                                { label: 'Verdampfer', data: temperatureHistory.verdampfer, borderColor: '#ff6b6b', borderWidth: 2, pointRadius: 0, tension: 0.3, yAxisID: 'y1' },
                                { label: 'Einschaltpunkt', data: temperatureHistory.sollwerte, borderColor: '#b197fc', borderWidth: 2, borderDash: [8, 4], pointRadius: 0, tension: 0, fill: false, spanGaps: true }
                            ]
                        },
                        options: {
                            responsive: true, maintainAspectRatio: false,
                            plugins: {
                                legend: { display: true, position: 'top', labels: { color: '#a0a0c0', font: { size: 11 }, usePointStyle: true } },
                                tooltip: { mode: 'index', intersect: false, backgroundColor: 'rgba(22, 33, 62, 0.95)', titleColor: '#fff', bodyColor: '#a0a0c0', borderColor: 'rgba(0, 212, 255, 0.3)', borderWidth: 1 }
                            },
                            scales: {
                                y: { min: getBoilerRange().min, max: getBoilerRange().max, grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#a0a0c0', callback: v => v + ' °C' }, title: { display: true, text: 'Boiler (°C)', color: '#a0a0c0' } },
                                y1: { position: 'right', min: getVerdampferRange().min, max: getVerdampferRange().max, grid: { display: false }, ticks: { color: '#ff6b6b', callback: v => v + ' °C' }, title: { display: true, text: 'Verdampfer (°C)', color: '#ff6b6b' } },
                                x: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#a0a0c0', maxRotation: 45, minRotation: 45, maxTicksLimit: 20 } }
                            },

            setTimeout(() => { if (!chart) createChart(); }, 5000);
        }

                function toggleMode(modeName, currentState) {
            sendControl('set_mode', { mode: modeName, active: !currentState });
        }

        function toggleRuleDetail(ruleId) {
            const el = document.getElementById('rule-decision-' + ruleId);
            if (el) {
                el.classList.toggle('visible');
            }
        }

                // Auto-refresh every 5 seconds
        setInterval(fetchStatus, 5000);

        // Initial load
        fetchStatus().then(() => {
            // Nach dem ersten Fetch Historie laden
            loadHistory(currentHistoryHours);
        });

        // Register service worker for PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js')
                .then(reg => console.log('Service Worker registered'))
                .catch(err => console.error('Service Worker registration failed:', err));
        }
    </script>
</body>
