<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1a1a2e">
    <title>Wärmepumpen Steuerung</title>
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0f0f1e;
            --bg-secondary: #1a1a2e;
            --bg-card: #16213e;
            --accent-primary: #00d4ff;
            --accent-secondary: #ff6b6b;
            --accent-success: #51cf66;
            --accent-warning: #ffd43b;
            --text-primary: #ffffff;
            --text-secondary: #a0a0c0;
            --shadow: rgba(0, 212, 255, 0.2);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeInDown 0.6s ease-out;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-primary), #0099ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1rem;
        }

                .status-indicator {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 15px;
            padding: 8px 16px;
            background: rgba(0, 212, 255, 0.1);
            border-radius: 20px;
            font-size: 0.9rem;
        }

        .status-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .status-badge {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .badge-compressor {
            background: rgba(81, 207, 102, 0.2);
            color: var(--accent-success);
        }

        .badge-compressor.off {
            background: rgba(255, 107, 107, 0.15);
            color: var(--accent-secondary);
        }

        .badge-night {
            background: rgba(99, 110, 250, 0.2);
            color: #748ffc;
        }

        .badge-info {
            background: rgba(0, 212, 255, 0.2);
            color: var(--accent-primary);
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--accent-success);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.6;
                transform: scale(1.1);
            }
        }

                .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .grid-wide {
            grid-column: 1 / -1;
        }

        .chart-container {
            grid-column: 1 / -1;
        }

        .card {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 48px var(--shadow);
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 20px;
        }

        .card-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            background: linear-gradient(135deg, var(--accent-primary), #0099ff);
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-primary);
            flex: 1;
        }

                .btn-small {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            background: linear-gradient(135deg, var(--accent-primary), #0099ff);
            color: white;
        }

        .btn-small:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px var(--shadow);
        }

        .time-range-group {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }

        .time-btn {
            padding: 6px 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.03);
            color: var(--text-secondary);
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .time-btn:hover {
            background: rgba(0, 212, 255, 0.1);
            border-color: rgba(0, 212, 255, 0.3);
            color: var(--text-primary);
        }

        .time-btn.active {
            background: rgba(0, 212, 255, 0.2);
            border-color: var(--accent-primary);
            color: var(--accent-primary);
        }

        .chart-header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .temp-display {
            display: flex;
            align-items: baseline;
            gap: 8px;
            margin: 10px 0;
        }

        .temp-value {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-primary), #00b4d8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .temp-unit {

            color: var(--text-secondary);
        }

        .temp-label {

        }

        .button-group {

        }

        .btn {

            padding: 14px 24px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn:active::before {
            width: 300px;
            height: 300px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-primary), #0099ff);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);

        }

        .btn-danger {

            color: white;
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(255, 107, 107, 0.3);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .toggle-switch {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            margin: 10px 0;
            transition: background 0.3s ease;
            cursor: pointer;
        }

        .toggle-switch:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .toggle-label {
            font-size: 1rem;
            color: var(--text-primary);
        }

        .switch {
            position: relative;
            width: 60px;
            height: 30px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            transition: background 0.3s ease;
        }

        .switch.active {
            background: var(--accent-primary);
        }

        .switch::after {
            content: '';
            position: absolute;
            top: 3px;
            left: 3px;
            width: 24px;
            height: 24px;
            background: white;
            border-radius: 50%;
            transition: transform 0.3s ease;
        }

        .switch.active::after {
            transform: translateX(30px);
        }

        .rule-card.winner {
            background: rgba(81, 207, 102, 0.1);
            border-left-color: var(--accent-success);

        .rule-card.loser {
            background: rgba(255, 255, 255, 0.02);
            border-left-color: rgba(255, 255, 255, 0.1);
            opacity: 0.6;
        }

        .rule-card.inactive {
            background: rgba(255, 255, 255, 0.01);
            border-left-color: rgba(255, 107, 107, 0.3);
            opacity: 0.4;
        }

        .rule-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .rule-name {
            font-weight: 600;
        }

        .rule-prio {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .rule-detail {
            color: var(--text-secondary);
            font-size: 0.8rem;
        }

        .rule-decision {
            display: none;
            margin-top: 8px;
            padding: 8px 10px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 6px;
            font-size: 0.8rem;
            color: var(--text-secondary);
            line-height: 1.4;
        }

        .rule-decision.visible {
            display: block;
        }

        .rule-decision .decision-ein {
            color: var(--accent-success);
            font-weight: 600;
        }

        .rule-decision .decision-aus {
            color: var(--accent-secondary);
            font-weight: 600;
        }

        .rule-decision .decision-keine {
            color: var(--text-secondary);
            font-weight: 600;
        }

        .rule-grund {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 4px;
            padding: 2px 6px;
            background: var(--bg-card);
            border-radius: 4px;
            word-break: break-word;
        }

        .loading {
            text-align: center;
            padding: 40px;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--accent-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }

            .grid {
                grid-template-columns: 1fr;
            }
        }

<body>
    <div class="container">
                <header>
            <h1>Wärmepumpen Steuerung</h1>
            <p class="subtitle">Pareto-Prioritätenregelung mit Solar-Integration</p>
            <div class="status-bar">
                <div class="status-indicator">
                    <span class="status-dot"></span>
                    <span id="connection-status">Verbunden</span>
                </div>
                <span class="status-badge badge-compressor off" id="header-compressor">Kompressor AUS</span>
                <span class="status-badge badge-night" id="header-nightsperre" style="display:none">🌙 Nacht</span>
                <span class="status-badge badge-info" id="header-rule" style="display:none"></span>
            </div>
        </header>

        <div id="app">
            <div class="loading">
                <div class="spinner"></div>
                <p style="margin-top: 20px; color: var(--text-secondary);">Lade Daten...</p>
            </div>
        </div>
    </div>

        <script>
                const API_BASE = window.location.origin;
        let statusData = null;
        let chart = null;
        let temperatureHistory = { timestamps: [], oben: [], mittig: [], unten: [], verdampfer: [], sollwerte: [] };
        const MAX_DATA_POINTS = 120;
        let currentHistoryHours = 24;
        let isLoadingHistory = false;

        async function fetchStatus() {
            try {
                const response = await fetch(`${API_BASE}/status`);
                if (!response.ok) throw new Error('API Fehler');
                statusData = await response.json();

                // Live-Daten nur hinzufuegen wenn wir im Live-Modus sind (< 2h)
                if (currentHistoryHours <= 2 && !isLoadingHistory) {
                    addToHistory(statusData.temperatures);
                }

                                // Nur beim ersten Mal oder wenn die Struktur sich aendert
                if (!document.getElementById('compressor-card')) {
                    renderApp();
                } else {
                    updateValues();
                    updateSollwertLabel();
                    highlightActiveSensor();
                }

                updateHeader();
                updateConnectionStatus(true);
            } catch (error) {
                console.error('Fehler beim Abrufen der Daten:', error);
                updateConnectionStatus(false);
            }
        }

                async function loadHistory(hours) {
            if (isLoadingHistory) return;
            isLoadingHistory = true;
            currentHistoryHours = hours;

            // Buttons aktualisieren
            document.querySelectorAll('.time-btn').forEach(btn => {
                btn.classList.toggle('active', parseInt(btn.dataset.hours) === hours);
            });

            // Vorhandenen Chart zerstoeren (wichtig: Daten-Reset kommt danach)
            if (chart) {
                chart.destroy();
                chart = null;
            }

            try {
                const response = await fetch(`${API_BASE}/history?hours=${hours}`);
                if (!response.ok) throw new Error('History API Fehler');
                const historyData = await response.json();

                // Historische Daten laden
                temperatureHistory = {
                    timestamps: [],
                    oben: [],
                    mittig: [],
                    unten: [],
                    verdampfer: [],
                    sollwerte: [],
                    regelIdx: [],
                    regelFarben: [],
                    regelTooltip: []
                };

                // Regel-Historie parallel laden (fuer Overlay)
                let regelnDaten = [];
                try {
                    const respR = await fetch(`${API_BASE}/history/regeln?hours=${hours}&limit=1000`);
                    if (respR.ok) {
                        const jd = await respR.json();
                        regelnDaten = jd.data || [];
                    }
                } catch (e) { console.warn('Regel-Historie nicht verfuegbar:', e); }

                const namenZuIdx = new Map();
                const idxZuFarbe = [];
                function regelFarbe(name) {
                    if (name === 'Keine' || !name) return 'rgba(128,128,128,0.15)';
                    let h = 0;
                    for (let i = 0; i < name.length; i++) { h = (h * 31 + name.charCodeAt(i)) % 360; }
                    return 'hsla(' + h + ',70%,55%,0.35)';
                }

                historyData.data.forEach(point => {
                    const timestamp = new Date(point.timestamp);
                    const timeStr = hours <= 24
                        ? timestamp.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' })
                        : timestamp.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' }) + ' ' +
                          timestamp.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });

                    temperatureHistory.timestamps.push(timeStr);
                    temperatureHistory.oben.push(point.t_oben);
                    temperatureHistory.mittig.push(point.t_mittig);
                    temperatureHistory.unten.push(point.t_unten);
                    temperatureHistory.verdampfer.push(point.t_verd);
                    // Sollwerte direkt aus CSV (Einschaltpunkt-Spalte)
                    temperatureHistory.sollwerte.push(point.einschaltpunkt);
                });

                // Regelverlauf auf die Temperatur-Timestamps abbilden:
                // je Punkt die zuletzt bekannte gewinnende Regel.
                let zeigerR = 0;
                let letzteRegel = 'Keine';
                const parseTs = (s) => new Date(s).getTime();
                historyData.data.forEach(point => {
                    const tsPunkt = parseTs(point.timestamp);
                    while (zeigerR < regelnDaten.length &&
                           parseTs(regelnDaten[zeigerR].timestamp) <= tsPunkt) {
                        letzteRegel = regelnDaten[zeigerR].regel;
                        zeigerR++;
                    }
                    if (!namenZuIdx.has(letzteRegel)) {
                        namenZuIdx.set(letzteRegel, namenZuIdx.size);
                    }
                    temperatureHistory.regelIdx.push(namenZuIdx.get(letzteRegel));
                    temperatureHistory.regelFarben.push(regelFarbe(letzteRegel));
                    temperatureHistory.regelTooltip.push(letzteRegel);
                });
                window._regelnLegende = Array.from(namenZuIdx.keys());

                // Chart mit den geladenen Daten neu erstellen
                createChart();
                updateSollwertLabel();
                highlightActiveSensor();
            } catch (error) {
                console.error('Fehler beim Laden der Historie:', error);
                // Fallback: leeren Chart erstellen falls API fehlschlaegt
                if (!chart) createChart();
            } finally {
                isLoadingHistory = false;
            }
        }

                function getBoilerRange() {
                    let min = Infinity, max = -Infinity;
                    const series = [temperatureHistory.oben, temperatureHistory.mittig, temperatureHistory.unten, temperatureHistory.sollwerte];
                    series.forEach(arr => {
                        arr.forEach(v => {
                            if (v !== null && v !== undefined && !isNaN(v)) { min = Math.min(min, v); max = Math.max(max, v); }
                        });
                    });
                    if (min === Infinity) { min = 0; max = 60; }
                    const pad = Math.max((max - min) * 0.15, 3);
                    return { min: Math.floor(min - pad), max: Math.ceil(max + pad) };
                }
                function getVerdampferRange() {
                    let min = Infinity, max = -Infinity;
                    temperatureHistory.verdampfer.forEach(v => {
                        if (v !== null && v !== undefined && !isNaN(v)) { min = Math.min(min, v); max = Math.max(max, v); }
                    });
                    if (min === Infinity) { min = -10; max = 15; }
                    const pad = Math.max((max - min) * 0.15, 3);
                    return { min: Math.floor(min - pad), max: Math.ceil(max + pad) };
                }

                                { label: 'Einschaltpunkt', data: temperatureHistory.sollwerte, borderColor: '#b197fc', borderWidth: 2, borderDash: [8, 4], pointRadius: 0, tension: 0, fill: false, spanGaps: true },

            // PV-Profil-Minichart
            function zeichnePvProfil(stunden) {
                const canvas = document.getElementById('pv-profil-chart');
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                const w = canvas.width, h = canvas.height;
                let maxV = 0;
                for (const k in stunden) { if (stunden[k] > maxV) maxV = stunden[k]; }
                if (maxV <= 0) return;
                const bw = w / 24;
                for (let i = 0; i < 24; i++) {
                    const v = stunden[String(i)] ?? 0;
                    const bh = (v / maxV) * (h - 14);
                    const grad = ctx.createLinearGradient(0, h, 0, h - bh);
                    grad.addColorStop(0, '#ff9800');
                    grad.addColorStop(1, '#ffc107');
                    ctx.fillStyle = grad;
                    ctx.fillRect(i * bw + 1, h - 10 - bh, bw - 2, bh);
                    if (i % 6 === 0) {
                        ctx.fillStyle = '#888';
                        ctx.font = '9px sans-serif';
                        ctx.fillText(i, i * bw + 2, h - 1);
                    }
                }

                    <!-- Energiebilanz -->
                    <div class="card">
                        <div class="card-header">
                            <div class="card-icon green">🌱</div>
                            <div class="card-title">Ernte (Energiebilanz)</div>
                        </div>
                        <div class="temp-display">
                            <span class="temp-value" id="kpi-heute-kwh">0.0</span>
                            <span class="temp-unit">kWh</span>
                        </div>
                        <div class="temp-label">WP-Energie heute</div>
                        <div class="info-row"><span class="info-label">Anteil PV/Batterie</span><span class="info-value" id="kpi-heute-pv">N/A</span></div>
                        <div class="info-row"><span class="info-label">Netzanteil heute</span><span class="info-value" id="kpi-heute-netz">0.00 kWh</span></div>
                        <div class="info-row"><span class="info-label">Netzkosten heute</span><span class="info-value" id="kpi-heute-kosten">0.00 EUR</span></div>
                        <div class="info-row"><span class="info-label">Laufzeit heute</span><span class="info-value" id="kpi-heute-laufzeit">0 min</span></div>
                        <div class="info-row"><span class="info-label">7 Tage: PV/Batterie-Anteil</span><span class="info-value" id="kpi-woche-pv">N/A</span></div>
                        <div class="info-row"><span class="info-label">7 Tage: Netzkosten</span><span class="info-value" id="kpi-woche-kosten">0.00 EUR</span></div>
                    </div>

                    <!-- Selbstlernen -->
                    <div class="card">
                        <div class="card-header">
                            <div class="card-icon blue">🧠</div>
                            <div class="card-title">Selbstlernen</div>
                        </div>
                        <div class="info-row"><span class="info-label">Gelernte Zapf-Zeit</span><span class="info-value" id="learn-target">N/A</span></div>
                        <div class="info-row"><span class="info-label">Abend-Fenster (gelernt)</span><span class="info-value" id="learn-fenster">N/A</span></div>
                        <div class="info-row"><span class="info-label">Heizrate Winter</span><span class="info-value" id="learn-rate-winter">N/A</span></div>
                        <div class="info-row"><span class="info-label">Heizrate Uebergang</span><span class="info-value" id="learn-rate-transition">N/A</span></div>
                        <div class="info-row"><span class="info-label">Heizrate Sommer</span><span class="info-value" id="learn-rate-summer">N/A</span></div>
                        <div class="info-row"><span class="info-label">Lern-Basis</span><span class="info-value" id="learn-counts">-</span></div>
                        <div class="info-row" style="font-size:0.75rem;color:var(--text-secondary)">CalcStart richtet die Vorheizung an der gelernten Zapf-Zeit aus; MinTemp-Fenster folgen dem gelernten Abend-Fenster.</div>
                        <div class="info-row"><span class="info-label">Komfort-Verletzungen (7T)</span><span class="info-value" id="learn-komfort">N/A</span></div>
                        <div class="info-row"><span class="info-label">Morgen-Zapf-Zeit (gelernt)</span><span class="info-value" id="learn-morgen">N/A</span></div>
                        <div class="info-row"><span class="info-label">Forecast-Kalibrierung</span><span class="info-value" id="learn-fc-ratio">N/A</span></div>
                        <div class="info-row"><span class="info-label">WW-Quellen (Laufzeit)</span><span class="info-value" id="learn-quellen" style="font-size:0.75rem">N/A</span></div>
                        <div class="info-row"><span class="info-label">Zu fr&uuml;h geheizt (14T)</span><span class="info-value" id="learn-zufrueh">N/A</span></div>
                    </div>

                    <!-- PV-Ueberschuss-Profil (gelernt) -->
                    <div class="card">
                        <div class="card-header">
                            <div class="card-icon green">&#128202;</div>
                            <div class="card-title">&Uuml;berschuss-Profil (gelernt)</div>
                        </div>
                        <div id="surplus-bars" style="margin:6px 0"></div>
                        <div class="info-row" style="font-size:0.75rem;color:var(--text-secondary)">Netzeinspeisung je Stunde (bei ausgeschalteter WP = Haushaltsmuster). Rote Balken sind Tiefstunden (&lt;250 W, z.&nbsp;B. Kochen) - sie verfr&uuml;hen den CalcStart-Sp&auml;test-Start.</div>
                    </div>

                    <!-- Boiler-Fuellstand (Punkt A) -->
                    <div class="card">
                        <div class="card-header">
                            <div class="card-icon orange">🛁</div>
                            <div class="card-title">Boiler-Vorrat</div>
                        </div>
                        <div class="temp-display">
                            <span class="temp-value" id="boiler-liter">0</span>
                            <span class="temp-unit">L</span>
                        </div>
                        <div class="temp-label">Warmwasser &gt; 40&deg;C</div>
                        <div class="info-row"><span class="info-label">Fuellstand</span><span class="info-value" id="boiler-anteil">N/A</span></div>
                        <div class="progress-bar" style="height:10px;background:#333;border-radius:5px;overflow:hidden;margin-top:8px">
                            <div id="boiler-bar" style="height:100%;width:0%;background:linear-gradient(90deg,#ff9800,#ffc107);transition:width .5s"></div>
                        </div>
                    </div>

                    <!-- Taktschutz + Komfort (Punkte B/D) -->
                    <div class="card">
                        <div class="card-header">
                            <div class="card-icon purple">🛡️</div>
                            <div class="card-title">Taktschutz</div>
                        </div>
                        <div class="info-row"><span class="info-label">Wechsel / Stunde</span><span class="info-value" id="takt-wechsel">0</span></div>
                        <div class="info-row"><span class="info-label">Grenzwert</span><span class="info-value" id="takt-grenze">8</span></div>
                        <div class="info-row"><span class="info-label">Status</span><span class="info-value" id="takt-status">OK</span></div>
                    </div>

                    <!-- PV-Profil (Punkt E) -->
                    <div class="card">
                        <div class="card-header">
                            <div class="card-icon green">☀️</div>
                            <div class="card-title">PV-Profil (gelernt)</div>
                        </div>
                        <div class="info-row"><span class="info-label">Peak-Leistung (&empty;)</span><span class="info-value" id="pv-peak">N/A</span></div>
                        <div class="info-row"><span class="info-label">Mittags-Erwartung</span><span class="info-value" id="pv-mittag">N/A</span></div>
                        <div class="info-row"><span class="info-label">Abend-Erwartung (17h)</span><span class="info-value" id="pv-abend">N/A</span></div>
                        <canvas id="pv-profil-chart" height="90" style="margin-top:8px"></canvas>
                    </div>

                    <!-- System Info -->
                    <div class="card">
                        <div class="card-header">
                            <div class="card-icon blue">ℹ️</div>
                            <div class="card-title">System</div>
                        </div>
                        <div class="info-row" id="system-update-row"><span class="info-label">Letztes Update</span><span class="info-value" id="system-update">${system.last_update}</span></div>
                        <div class="info-row"><span class="info-label">Sonnenaufgang</span><span class="info-value" id="system-sunrise">${energy.sunrise || 'N/A'}</span></div>
                        <div class="info-row"><span class="info-label">Sonnenuntergang</span><span class="info-value" id="system-sunset">${energy.sunset || 'N/A'}</span></div>
                        <div class="info-row"><span class="info-label">WP Leistung</span><span class="info-value" id="system-wp-leistung">${priority?.wp_leistung || 0} W</span></div>
                        <div class="info-row"><span class="info-label">Nachtsperre</span><span class="info-value" id="system-nachtsperre">${nachtsperreTxt}</span></div>
                    </div>
                </div>
            `;
            // Chart wird jetzt in loadHistory() erstellt, sobald CSV-Daten da sind
            setTimeout(() => { if (!chart) createChart(); }, 5000);
        }

                function toggleMode(modeName, currentState) {
            sendControl('set_mode', { mode: modeName, active: !currentState });
        }

        function toggleRuleDetail(ruleId) {
            const el = document.getElementById('rule-decision-' + ruleId);
            if (el) {
                el.classList.toggle('visible');
            }
        }

                // ===== Zoom / Horizontal / Fullscreen Funktionen =====
        function resetChartZoom() {
            if (chart) {
                chart.resetZoom();
            }
        }

        function toggleHorizontal() {
            const wrapper = document.getElementById('chart-wrapper');
            const btn = document.getElementById('btn-horizontal');
            wrapper.classList.toggle('horizontal-mode');
            btn.classList.toggle('active');
            if (chart) chart.resize();
        }

        function toggleFullscreen() {
            const wrapper = document.getElementById('chart-wrapper');
            const btn = document.getElementById('btn-fullscreen');
            wrapper.classList.toggle('fullscreen');
            btn.classList.toggle('active');
            if (chart) chart.resize();
            if (wrapper.classList.contains('fullscreen')) {
                document.addEventListener('keydown', _fsEscapeHandler);
            } else {
                document.removeEventListener('keydown', _fsEscapeHandler);
            }
        }

        function _fsEscapeHandler(e) {
            if (e.key === 'Escape') {
                const wrapper = document.getElementById('chart-wrapper');
                if (wrapper.classList.contains('fullscreen')) {
                    wrapper.classList.remove('fullscreen');
                    document.getElementById('btn-fullscreen').classList.remove('active');
                    if (chart) chart.resize();
                    document.removeEventListener('keydown', _fsEscapeHandler);
                }
            }
        }

        // ===== Zoom / Horizontal / Fullscreen Funktionen =====
        function resetChartZoom() {
            if (chart) {
                chart.resetZoom();
            }
        }

        function toggleHorizontal() {
            const wrapper = document.getElementById('chart-wrapper');
            const btn = document.getElementById('btn-horizontal');
            wrapper.classList.toggle('horizontal-mode');
            btn.classList.toggle('active');
            if (chart) chart.resize();
        }

        function toggleFullscreen() {
            const wrapper = document.getElementById('chart-wrapper');
            const btn = document.getElementById('btn-fullscreen');
            wrapper.classList.toggle('fullscreen');
            btn.classList.toggle('active');
            if (chart) chart.resize();
            if (wrapper.classList.contains('fullscreen')) {
                document.addEventListener('keydown', _fsEscapeHandler);
            } else {
                document.removeEventListener('keydown', _fsEscapeHandler);
            }
        }

        function _fsEscapeHandler(e) {
            if (e.key === 'Escape') {
                const wrapper = document.getElementById('chart-wrapper');
                if (wrapper.classList.contains('fullscreen')) {
                    wrapper.classList.remove('fullscreen');
                    document.getElementById('btn-fullscreen').classList.remove('active');
                    if (chart) chart.resize();
                    document.removeEventListener('keydown', _fsEscapeHandler);
                }
            }
        }

        // Auto-refresh every 5 seconds
        setInterval(fetchStatus, 5000);

        // Initial load
        fetchStatus().then(() => {
            // Nach dem ersten Fetch Historie laden
            loadHistory(currentHistoryHours);
        });

        // Register service worker for PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js')
                .then(reg => console.log('Service Worker registered'))
                .catch(err => console.error('Service Worker registration failed:', err));
        }
    </script>
</body>

</html>
